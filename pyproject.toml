[project]
name = "sgrep-jev"
version = "0.1.0"
description = "Semantic grep for codebases, powered by Jev (TypeSafe System One)."
readme = "README.md"
requires-python = ">=3.10"
# httpx gives pooled HTTP/2 keep-alive (big latency win vs a TLS handshake per call).
# It's optional: without it, the client falls back to stdlib urllib.
dependencies = ["httpx[http2]>=0.27"]

[project.optional-dependencies]
# Local Model2Vec pre-filter (the top-k funnel). Falls back to a zero-dep lexical
# filter if these aren't installed.
semantic = ["model2vec>=0.3", "numpy>=1.24"]
# Multi-language AST chunking (JS/TS/TSX/Java). Python uses the stdlib `ast`.
parsers = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.9"]
# Nicer terminal output.
ui = ["rich>=13"]
all = [
    "model2vec>=0.3", "numpy>=1.24",
    "tree-sitter>=0.21", "tree-sitter-language-pack>=0.9",
    "rich>=13",
]

[project.scripts]
sgrep = "sgrep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
